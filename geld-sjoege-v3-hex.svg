<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="400" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060D18"/>
      <stop offset="100%" stop-color="#0A1525"/>
    </linearGradient>
    <linearGradient id="teal3" x1="48" y1="76" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="48" y1="70" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blue3" x1="0" y1="68" x2="0" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect width="400" height="80" rx="12" fill="url(#bg3)"/>
  <rect width="400" height="1" rx="0.5" fill="white" opacity="0.04"/>

  <!-- Hexagon: center (48,40) radius 32, pointy-top -->
  <!-- Points: (48,8),(75.7,24),(75.7,56),(48,72),(20.3,56),(20.3,24) -->
  <polygon points="48,8 75.7,24 75.7,56 48,72 20.3,56 20.3,24"
           fill="#0C1F20"/>
  <polygon points="48,8 75.7,24 75.7,56 48,72 20.3,56 20.3,24"
           fill="none" stroke="url(#teal3)" stroke-width="2.2"/>
  <!-- Inner hex ring (radius 24) -->
  <!-- (48,16)(68.8,28)(68.8,52)(48,64)(27.2,52)(27.2,28) -->
  <polygon points="48,16 68.8,28 68.8,52 48,64 27.2,52 27.2,28"
           fill="none" stroke="url(#teal3)" stroke-width="0.6" opacity="0.22"/>

  <!-- Arrow shaft -->
  <line x1="48" y1="64" x2="48" y2="22" stroke="url(#blue3)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="48,13 40,26 56,26" fill="url(#teal3)"/>

  <!-- Left leaf -->
  <path d="M 48,50 C 33,44 24,30 31,20 C 37,12 47,36 48,50 Z" fill="url(#leaf3)" opacity="0.88"/>
  <line x1="48" y1="50" x2="33" y2="22" stroke="#047857" stroke-width="1" opacity="0.45"/>

  <!-- Right leaf -->
  <path d="M 48,42 C 63,36 70,23 63,14 C 56,7 47,28 48,42 Z" fill="url(#leaf3)"/>
  <line x1="48" y1="42" x2="62" y2="16" stroke="#047857" stroke-width="1" opacity="0.45"/>

  <!-- Divider line -->
  <line x1="94" y1="14" x2="94" y2="66" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>

  <!-- GELD + SJOEGE on one line -->
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" y="46">
    <tspan x="108" font-weight="900" font-size="27" fill="#FFFFFF" letter-spacing="1">GELD</tspan><tspan dx="10" font-weight="300" font-size="21" fill="#34D399" letter-spacing="3">SJOEGE</tspan>
  </text>

  <!-- Tagline -->
  <text x="108" y="63" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9" fill="#5EEAD4" letter-spacing="2.5" opacity="0.6">SLIM &amp; DUURZAAM BESPAREN</text>
</svg>
