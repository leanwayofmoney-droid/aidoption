<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="440" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="leftHalf5" x1="55" y1="98" x2="55" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="rightHalf5" x1="55" y1="98" x2="55" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="split5" x1="20" y1="55" x2="90" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="textGreen5" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.06  0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0.3 0" result="colored"/>
      <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="110" rx="14" fill="url(#bg5)"/>
  <rect width="440" height="1" rx="0.5" fill="white" opacity="0.04"/>

  <!-- Leaf-Arrow: pointed tip top, organic rounded base -->
  <!-- Full outline path -->
  <path d="M 55,4 C 55,4 84,30 87,56 C 89,74 77,94 55,98 C 33,94 21,74 23,56 C 26,30 55,4 55,4 Z"
        fill="#0C1620" filter="url(#glow5)"/>

  <!-- Left half: green -->
  <path d="M 55,4 C 55,4 26,30 23,56 C 21,74 33,94 55,98 L 55,4 Z"
        fill="url(#leftHalf5)" opacity="0.88"/>

  <!-- Right half: blue -->
  <path d="M 55,4 C 55,4 84,30 87,56 C 89,74 77,94 55,98 L 55,4 Z"
        fill="url(#rightHalf5)" opacity="0.88"/>

  <!-- Outline -->
  <path d="M 55,4 C 55,4 84,30 87,56 C 89,74 77,94 55,98 C 33,94 21,74 23,56 C 26,30 55,4 55,4 Z"
        fill="none" stroke="url(#split5)" stroke-width="2"/>

  <!-- Center vein -->
  <line x1="55" y1="8" x2="55" y2="93" stroke="white" stroke-width="1.5" opacity="0.18"/>

  <!-- Side veins (left) -->
  <line x1="55" y1="36" x2="38" y2="53" stroke="white" stroke-width="1" opacity="0.14"/>
  <line x1="55" y1="54" x2="34" y2="68" stroke="white" stroke-width="1" opacity="0.12"/>
  <line x1="55" y1="70" x2="37" y2="81" stroke="white" stroke-width="0.8" opacity="0.1"/>
  <!-- Side veins (right) -->
  <line x1="55" y1="36" x2="72" y2="53" stroke="white" stroke-width="1" opacity="0.14"/>
  <line x1="55" y1="54" x2="76" y2="68" stroke="white" stroke-width="1" opacity="0.12"/>
  <line x1="55" y1="70" x2="73" y2="81" stroke="white" stroke-width="0.8" opacity="0.1"/>

  <!-- Tip sparkle -->
  <circle cx="55" cy="4" r="3.5" fill="white" opacity="0.55"/>
  <circle cx="55" cy="4" r="1.5" fill="white" opacity="0.9"/>

  <!-- Text -->
  <text x="108" y="44" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="31" fill="#FFFFFF">GELD</text>
  <!-- Two-tone underline -->
  <rect x="108" y="49" width="54" height="2" rx="1" fill="#10B981" opacity="0.75"/>
  <rect x="166" y="49" width="54" height="2" rx="1" fill="#38BDF8" opacity="0.75"/>

  <text x="108" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="300" font-size="22" fill="url(#textGreen5)" letter-spacing="5">SJOEGE</text>
  <text x="108" y="91" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#5EEAD4" letter-spacing="2.5" opacity="0.6">SLIM &amp; DUURZAAM BESPAREN</text>
</svg>
