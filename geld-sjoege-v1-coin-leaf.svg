<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="440" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07101F"/>
      <stop offset="100%" stop-color="#0B1A2C"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="100" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="44" x2="0" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <rect width="440" height="110" rx="14" fill="url(#bg1)"/>
  <rect width="440" height="1" rx="0.5" fill="white" opacity="0.04"/>

  <!-- Leaf above coin -->
  <path d="M 52,44 C 28,44 26,12 52,12 C 78,12 76,44 52,44 Z" fill="url(#leaf1)"/>
  <!-- Leaf veins -->
  <line x1="52" y1="14" x2="52" y2="42" stroke="#047857" stroke-width="1.3" opacity="0.55"/>
  <line x1="52" y1="22" x2="64" y2="30" stroke="#047857" stroke-width="0.9" opacity="0.45"/>
  <line x1="52" y1="32" x2="41" y2="39" stroke="#047857" stroke-width="0.9" opacity="0.45"/>

  <!-- Stem -->
  <line x1="52" y1="44" x2="52" y2="52" stroke="#10B981" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Coin circle -->
  <circle cx="52" cy="78" r="27" fill="#0C1E3A"/>
  <circle cx="52" cy="78" r="27" fill="none" stroke="url(#blue1)" stroke-width="2.5"/>
  <!-- Inner coin ring -->
  <circle cx="52" cy="78" r="22" fill="none" stroke="url(#blue1)" stroke-width="0.6" opacity="0.25"/>

  <!-- Euro symbol inside coin -->
  <path d="M 62,70 C 62,62 40,62 40,78 C 40,94 62,94 62,86" fill="none" stroke="url(#blue1)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37" y1="74" x2="54" y2="74" stroke="url(#blue1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="81" x2="52" y2="81" stroke="url(#blue1)" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertical divider -->
  <line x1="100" y1="18" x2="100" y2="94" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>

  <!-- Text -->
  <text x="116" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="31" fill="#FFFFFF" letter-spacing="1">GELD</text>
  <rect x="116" y="53" width="104" height="2" rx="1" fill="url(#leaf1)" opacity="0.75"/>
  <text x="117" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="300" font-size="22" fill="#34D399" letter-spacing="5">SJOEGE</text>
  <text x="117" y="95" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#60A5FA" letter-spacing="2.5" opacity="0.55">SLIM &amp; DUURZAAM BESPAREN</text>
</svg>
