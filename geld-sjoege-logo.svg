<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="420" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060C1A"/>
      <stop offset="100%" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="90" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="coinFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152038"/>
      <stop offset="100%" stop-color="#091422"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="coinClip">
      <circle cx="50" cy="50" r="34"/>
    </clipPath>
  </defs>

  <!-- Background pill -->
  <rect width="420" height="100" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle top highlight -->
  <rect width="420" height="1" rx="0.5" fill="white" opacity="0.04"/>

  <!-- Coin outer glow -->
  <circle cx="50" cy="50" r="38" fill="url(#goldGlow)" opacity="0.15"/>

  <!-- Coin body -->
  <circle cx="50" cy="50" r="34" fill="url(#coinFill)"/>

  <!-- Coin ring - double stroke for depth -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#1D4ED8" stroke-width="0.75" opacity="0.3"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#blueGrad)" stroke-width="2"/>

  <!-- Trend line inside coin (clipped) -->
  <g clip-path="url(#coinClip)">
    <!-- Area fill under line -->
    <path d="M18,72 L28,60 L38,64 L52,44 L68,30 L68,80 L18,80 Z"
          fill="url(#blueGrad)" opacity="0.08"/>
    <!-- Trend line -->
    <polyline
      points="18,72 28,60 38,64 52,44 68,30"
      fill="none"
      stroke="url(#blueGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"/>
    <!-- Data dots -->
    <circle cx="18" cy="72" r="2.5" fill="#1D4ED8"/>
    <circle cx="28" cy="60" r="2.5" fill="#2563EB"/>
    <circle cx="38" cy="64" r="2.5" fill="#3B82F6"/>
    <circle cx="52" cy="44" r="2.5" fill="#60A5FA"/>
    <!-- Gold peak dot -->
    <circle cx="68" cy="30" r="7" fill="url(#goldGlow)"/>
    <circle cx="68" cy="30" r="4" fill="#F59E0B" filter="url(#softGlow)"/>
    <circle cx="68" cy="30" r="2" fill="#FDE68A"/>
  </g>

  <!-- Vertical divider -->
  <line x1="100" y1="20" x2="100" y2="80" stroke="#1E3A5F" stroke-width="1" opacity="0.5"/>

  <!-- GELD text -->
  <text x="118" y="47"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="30"
    fill="#FFFFFF"
    letter-spacing="2">GELD</text>

  <!-- Gold accent underline -->
  <rect x="118" y="52" width="102" height="2" rx="1" fill="url(#goldGrad)" opacity="0.75"/>

  <!-- SJOEGE text -->
  <text x="119" y="74"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="19"
    fill="#60A5FA"
    letter-spacing="6">SJOEGE</text>

  <!-- Small gold dot accent top-right of icon -->
  <circle cx="76" cy="20" r="2.5" fill="#F59E0B" opacity="0.5"/>
</svg>
