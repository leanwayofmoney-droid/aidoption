<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="440" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06091A"/>
      <stop offset="100%" stop-color="#091220"/>
    </linearGradient>
    <linearGradient id="drop4" x1="55" y1="102" x2="55" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="green4" x1="55" y1="90" x2="55" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="glow4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.06  0 0 0 0 0.4  0 0 0 0 1  0 0 0 0.35 0" result="colored"/>
      <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="440" height="110" rx="14" fill="url(#bg4)"/>
  <rect width="440" height="1" rx="0.5" fill="white" opacity="0.04"/>

  <!-- Water drop: tip top, rounded bottom -->
  <path d="M 55,8 C 78,35 86,56 86,68 C 86,86 72,102 55,102 C 38,102 24,86 24,68 C 24,56 32,35 55,8 Z"
        fill="#0E1E40" opacity="0.9" filter="url(#glow4)"/>
  <path d="M 55,8 C 78,35 86,56 86,68 C 86,86 72,102 55,102 C 38,102 24,86 24,68 C 24,56 32,35 55,8 Z"
        fill="none" stroke="url(#drop4)" stroke-width="2.5"/>

  <!-- Leaf vein structure inside drop (leaf AS the drop interior) -->
  <line x1="55" y1="22" x2="55" y2="90" stroke="url(#green4)" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
  <!-- Left veins -->
  <line x1="55" y1="44" x2="37" y2="60" stroke="url(#green4)" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="60" x2="35" y2="73" stroke="url(#green4)" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="75" x2="38" y2="84" stroke="url(#green4)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- Right veins -->
  <line x1="55" y1="44" x2="73" y2="60" stroke="url(#green4)" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="60" x2="75" y2="73" stroke="url(#green4)" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="55" y1="75" x2="72" y2="84" stroke="url(#green4)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Leaf tip dot -->
  <circle cx="55" cy="21" r="4" fill="#34D399" opacity="0.9"/>
  <circle cx="55" cy="21" r="2" fill="#A7F3D0"/>

  <!-- Glint highlight -->
  <ellipse cx="43" cy="32" rx="6" ry="10" fill="white" opacity="0.05" transform="rotate(-20,43,32)"/>

  <!-- Text -->
  <text x="106" y="46" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="31" fill="#FFFFFF">Geld</text>
  <text x="106" y="73" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="300" font-size="22" fill="#38BDF8" letter-spacing="5">Sjoege</text>
  <rect x="106" y="78" width="145" height="1.5" rx="0.75" fill="url(#green4)" opacity="0.5"/>
  <text x="106" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#34D399" letter-spacing="2.5" opacity="0.6">SLIM &amp; DUURZAAM BESPAREN</text>
</svg>
